<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты — Luxe Travel</title>
<meta name="description" content="Турагентство Luxe Travel: Караганда, ул. Гоголя, 34А. Телефон, WhatsApp, Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contacts">

<main>
  <section class="dark">
    <div class="wrap page-head">
      <div class="crumbs"><a href="index.html">Главная</a> / Контакты</div>
      <h1>Контакты</h1>
      <p class="lead">Приходите в офис или пишите в WhatsApp — подберём тур в удобном для вас формате.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="contact-cards" id="cards"></div>
    </div>
  </section>

  <section class="section-sm" style="padding-top:0">
    <div class="wrap two-col">
      <div>
        <h2 class="h3">Как нас найти</h2>
        <p class="lead" id="addr"></p>
        <div class="actions" style="margin-top:20px">
          <a class="btn btn-ink" target="_blank" rel="noopener" href="https://2gis.kz/karaganda/firm/70000001028727120">Открыть в 2ГИС</a>
          <a class="btn btn-ink" target="_blank" rel="noopener" href="https://yandex.kz/maps/?text=%D0%9A%D0%B0%D1%80%D0%B0%D0%B3%D0%B0%D0%BD%D0%B4%D0%B0%2C%20%D1%83%D0%BB.%20%D0%93%D0%BE%D0%B3%D0%BE%D0%BB%D1%8F%2C%2034%D0%90">Яндекс Карты</a>
        </div>
      </div>
      <!-- Карта: Яндекс Карты → «Поделиться» → «Встроить карту», вставьте сюда свой код при желании. -->
      <iframe class="map" title="Карта: Караганда, ул. Гоголя, 34А" loading="lazy"
        src="https://yandex.kz/map-widget/v1/?text=%D0%9A%D0%B0%D1%80%D0%B0%D0%B3%D0%B0%D0%BD%D0%B4%D0%B0%2C%20%D1%83%D0%BB.%20%D0%93%D0%BE%D0%B3%D0%BE%D0%BB%D1%8F%2C%2034%D0%90&z=16"></iframe>
    </div>
  </section>

  <div data-pick-block></div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  function initPage() {
    document.getElementById('addr').textContent = SITE.address + ', ' + SITE.office + '. ' + SITE.hours + '.';
    document.getElementById('cards').innerHTML =
      '<div class="contact-card"><h3>Телефоны</h3>' + SITE.phones.map((p) => '<p><a href="' + p.href + '">' + esc(p.text) + '</a></p>').join('') + '</div>' +
      '<div class="contact-card"><h3>WhatsApp</h3><p><a class="js-wa" href="#" data-text="Здравствуйте! Хочу подобрать тур.">Написать</a></p></div>' +
      '<div class="contact-card"><h3>Instagram</h3><p><a href="' + SITE.instagram + '" target="_blank" rel="noopener">' + esc(SITE.instagramName) + '</a></p></div>' +
      '<div class="contact-card"><h3>Часы работы</h3><p>' + esc(SITE.hours) + '</p></div>';
  }
</script>
</body>
</html>
